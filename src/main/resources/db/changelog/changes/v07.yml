databaseChangeLog:
  - changeSet:
      id: session-generated-id-and-external-id
      author: chief-coder
      changes:
        - createSequence:
            sequenceName: session_seq
            incrementBy: 1
            startValue: 1
        - addColumn:
            tableName: sessions
            columns:
              - column:
                  name: external_id
                  type: bigint
        - sql:
            sql: UPDATE sessions SET external_id = id WHERE external_id IS NULL
        - addUniqueConstraint:
            tableName: sessions
            columnNames: activity_id, external_id
            constraintName: uk_session_activity_external
        - sql:
            sql: |
              ALTER TABLE sessions ALTER COLUMN id SET DEFAULT nextval('session_seq');
              SELECT setval('session_seq', GREATEST((SELECT COALESCE(MAX(id), 1) FROM sessions), 1));
