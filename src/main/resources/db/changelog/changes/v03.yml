databaseChangeLog:
  - changeSet:
      id: add-users-email
      author: vrecon
      changes:
        - addColumn:
            tableName: users
            columns:
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    unique: true
                    nullable: true

  - changeSet:
      id: create-password-reset-token-table
      author: vrecon
      changes:
        - createSequence:
            sequenceName: password_reset_token_seq
            incrementBy: 1
            startValue: 1
            cache: 1
        - createTable:
            tableName: password_reset_tokens
            columns:
              - column:
                  name: id
                  type: bigint
                  defaultValueSequenceNext: password_reset_token_seq
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_password_reset_token_user
                    references: users(id)
              - column:
                  name: expiry_date
                  type: timestamp
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_password_reset_token_token
            tableName: password_reset_tokens
            columns:
              - column:
                  name: token
            unique: true
