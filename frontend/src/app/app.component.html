<ion-app>
  <ion-menu menuId="main-menu" contentId="main-content" type="overlay" class="ice-menu">
    <ion-header [translucent]="true">
      <ion-toolbar>
        <img class="toolbar-mark brand-mark" slot="start" src="assets/icon/ijsvogel.png" width="32" height="32" alt="IceInsights" />
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ice-menu-content">
      <ion-list lines="none" class="ice-menu-list">
        <ion-item button="true" routerLink="/seizoenen" (click)="closeMenu()" detail="false">
          <ion-icon name="calendar-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-label>Seizoenen</ion-label>
        </ion-item>
        <ion-item button="true" routerLink="/chips" (click)="closeMenu()" detail="false">
          <ion-icon name="hardware-chip-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-label>Chips</ion-label>
        </ion-item>
        <ion-item button="true" routerLink="/account" (click)="closeMenu()" detail="false">
          <ion-icon name="person-outline" slot="start" aria-hidden="true"></ion-icon>
          <ion-label>Account</ion-label>
        </ion-item>
      </ion-list>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
